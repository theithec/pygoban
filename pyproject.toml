[project]
name = "pygoban"
version = "0.1.0"
description = "Just another Go Board/ SGF Reader"
authors = [{ name = "Tim Heithecker", email = "tim.heithecker@gmail.com" }]

# dependencies = ["pyqt6", "PyQt6-Graphs>=6.8.0", "PyQt6-Charts>=6.8.0", "PyQt6-Multimedia>=6.8.0"]
dependencies = ["pyqt6", "PyQt6-Graphs>=6.8.0", "PyQt6-Charts>=6.8.0"] #, "PyQt6-Multimedia>=6.8.0"]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "pytest-mock>=3.12.0",
    "pytest-cov>=7.0.0",
    "pytest-qt>=4.2.0",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 100
[tool.pylint."messages control"]
disable = [
  "bad-inline-option",
  "deprecated-pragma",
  "file-ignored",
  "locally-disabled",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "raw-checker-failed",
  "suppressed-message",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-instance-attributes",
  "use-implicit-booleaness-not-comparison-to-string",
  "use-implicit-booleaness-not-comparison-to-zero",
  "use-symbolic-message-instead",
  "useless-suppression",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
(
  /(
    | \.git
    | \.tox
    | \.venv
    | _build
    | build
    | dist
  )/
  | migrations
  | \.mypy_cache
)
'''

[tool.isort]
profile = "black"


[tool.pdm]
distribution = true
[[tool.pdm.source]]
name = "pypi"
url = "https://pypi.org/simple"
verify_ssl = true
[tool.pdm.scripts]
start = "python -m pygoban.gui"
cov = "python -m pytest --cov=pygoban tests"
