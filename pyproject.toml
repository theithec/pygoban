[project]
name = "pygoban5"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Tim Heithecker", email = "tim.heithecker@gmail.com"},
]

dependencies = [
    "PyQt5>=5.15.11",
    #"pip>=23.3.1",
    "PyQtChart>=5.15.6",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
(
  /(
    | \.git
    | \.tox
    | \.venv
    | _build
    | build
    | dist
  )/
  | migrations
  | \.mypy_cache
)
'''

[tool.isort]
profile = "black"


[tool.pdm]
distribution = false
[[tool.pdm.source]]
name = "pypi"
url = "https://pypi.org/simple"
verify_ssl = true


[tool.pylint.format]
max_line_length = 100
[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "pytest-mock>=3.12.0",
    "mypy",
    "PyQt5-stubs>=5.15.6.0",
    "python-lsp-server>=1.12.0",
    "pylint>=3.3.2",
    "black>=24.10.0",
    "pylsp-mypy>=0.6.9",
    "python-lsp-black>=2.0.0",
    "python-lsp-isort>=0.1",
    "python-lsp-server>=1.12.0",
    "rope>=1.13.0",
    "pylsp-rope>=0.1.17",
]

[pytest]
testpaths = "tests"

